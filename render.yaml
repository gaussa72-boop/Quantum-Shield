services:
  - type: web
    name: ultima-membership-api
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/gaussa72-boop/Quantum-Shield
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ultima-membership-core
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: ""
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: ultima-membership-core
    databaseName: ultima_membership_core
    user: ultima_membership_core_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
