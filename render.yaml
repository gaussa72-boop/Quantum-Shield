services:
  - type: web
    name: ultima-membership-core
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
